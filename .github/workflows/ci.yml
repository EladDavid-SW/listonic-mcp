name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install ".[test]"
      - name: Import check
        run: python -c "import listonic_mcp"
      - name: CLI boots keyless
        run: listonic-mcp --version
      - name: HTTP transport tests (offline)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t listonic-mcp .
      - name: Start and probe /health and auth
        run: |
          TOKEN="$(openssl rand -hex 32)"
          docker run -d --name mcp -p 8000:8000 -e MCP_AUTH_TOKEN="$TOKEN" listonic-mcp
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/health && break; sleep 1; done
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          code() { curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d "$INIT" "$@"; }
          test "$(code)" = "401"
          test "$(code -H 'x-api-key: wrong')" = "401"
          test "$(code -H "x-api-key: $TOKEN")" = "200"
          test "$(code -H "X-MCP-API-Key: $TOKEN")" = "200"
          test "$(code -H "Authorization: Bearer $TOKEN")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/.well-known/oauth-protected-resource)" = "404"
          ! docker logs mcp 2>&1 | grep -qF "$TOKEN"
          docker logs mcp
